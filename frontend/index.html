<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observability Lab Console</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background-color: #1e293b; padding: 2rem; border-radius: 8px; width: 100%; max-width: 440px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    h2 { margin-top: 0; font-size: 1.25rem; }
    input[type="text"] { width: 100%; padding: 0.75rem; margin-top: 0.5rem; margin-bottom: 1rem; background-color: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #fff; }
    button { width: 100%; padding: 0.75rem; background-color: #2563eb; color: #fff; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; }
    button:hover { background-color: #1d4ed8; }
    #response { margin-top: 1rem; font-size: 0.875rem; padding: 0.5rem; border-radius: 4px; background: #334155; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Fullstack Ingestion Client</h2>
    <form id="labForm">
      <label for="dataInput">Payload Input</label>
      <input type="text" id="dataInput" placeholder="Enter telemetry data..." required>
      <button type="submit">Send to API Server</button>
    </form>
    <div id="response"></div>
  </div>

  <script>
    document.getElementById('labForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('dataInput');
      const resBox = document.getElementById('response');
      
      try {
        const res = await fetch('http://localhost:5000/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ payload: input.value })
        });
        const data = await res.json();
        resBox.style.display = 'block';
        resBox.textContent = `Server Acknowledged: ${JSON.stringify(data)}`;
        input.value = '';
      } catch (err) {
        resBox.style.display = 'block';
        resBox.textContent = `Connection Failed: ${err.message}`;
      }
    });
  </script>
</body>
</html>
